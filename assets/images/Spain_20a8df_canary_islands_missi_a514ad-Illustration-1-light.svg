    --accent-2: #ea580c;
    --accent-3: #dc2626;
    --accent-4: #65a30d;
    --accent-5: #16a34a;
    --accent-6: #92400e;
}
:root[data-theme="dark"] {
    --background: #0f172a;
    --panel: #1e293b;
